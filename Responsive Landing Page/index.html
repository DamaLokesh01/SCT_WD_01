<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillCraft Technology</title>
  <style>
  
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
  
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #232f3e;
      color: #fff;
      z-index: 999;
      padding: 0;
      box-shadow: none;
      transition: background 0.3s, box-shadow 0.3s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: roboto;
      font-size: 20px;
    }
    .navbar.scrolled {
      background: #1769aa; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-style: italic; 
    }
    .navbar .logo {
      padding: 1rem 2rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .navbar ul {
      list-style: none;
      display: flex;
      margin: 0;
      padding: 0;
    }
    .navbar ul li {
      margin: 0 8px;
    }
    .navbar ul li a {
      display: block;
      padding: 1rem 1.5rem;
      color: inherit;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
      border-radius: 5px;
    }
    .navbar ul li a:hover,
    .navbar ul li a:focus {
      background: #fff;
      color: #1769aa; 
      box-shadow: 0 2px 6px rgba(23,105,170,0.1);
    }
    
    .content {
      margin-top: 70px;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="logo">SkillCraft Technology</div>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#service">Service</a></li>
      <li><a href="project">Project</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
  <div class="content">
    <h1>Welcome Dama Lokesh</h1>
    <p>This is a sample page to demonstrate a fixed interactive navigation menu.</p>
    <p>Scroll down to see the navbar change style!</p>
    <div style="height:1500px;"></div>
  </div>

  <script>
    
    window.addEventListener('scroll', function() {
      const navbar = document.getElementById('navbar');
      if (window.scrollY > 30) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });
  </script>
</body>
</html>
